<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The app loads no external scripts, styles, fonts or data, so everything
      is locked to same-origin. 'unsafe-inline' is required for style-src only
      because React and Radix render inline style="" attributes.
      Note: frame-ancestors is ignored in a meta tag; GitHub Pages cannot set
      response headers, so clickjacking protection isn't available here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self';
               connect-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <title>Finance Drills</title>
    <meta name="description" content="Mental math practice on real stock data." />
    <meta name="author" content="willcpan" />

    <meta property="og:title" content="Finance Drills" />
    <meta property="og:description" content="Mental math practice on real stock data." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://willcpan.github.io/finance-drills/" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
