# Builds the site and deploys it to GitHub Pages.
#
# On a push, it deploys whatever prices are committed. On the schedule it first
# refreshes those prices and commits them, then builds from the tree it just
# refreshed - so the refresh and the deploy are one job. A commit pushed with
# GITHUB_TOKEN does not start another workflow run, so a separate deploy
# workflow would never see the new prices.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main'] # Change to 'master' if that's your default branch

  # Weekdays at 21:30 UTC, comfortably after the US close (20:00 UTC).
  schedule:
    - cron: '30 21 * * 1-5'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: write so the scheduled run can commit refreshed prices.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Use a version compatible with your project
          cache: 'npm'

      # Refreshing on a push as well would rewrite the data files on every
      # commit, so a push deploys the data it was pushed with.

      # Index membership and reported figures: about two dozen requests, and
      # mostly a no-op between filing seasons. It is what stops a company that
      # has left the index from lingering in the drill.
      #
      # SEC_CONTACT is optional - set it to an email to declare the traffic the
      # way the SEC asks. It must not contain the string "github", which they
      # reject outright.
      - name: Refresh universe
        if: github.event_name != 'push'
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: node scripts/refresh-universe.mjs

      - name: Refresh prices
        if: github.event_name != 'push'
        run: node scripts/refresh-prices.mjs

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Staged first: git diff alone reports no change for a file that is
          # not tracked yet.
          git add data/universe.json data/prices.json
          if git diff --cached --quiet -- data/universe.json data/prices.json; then
            echo "data unchanged"
          else
            git commit -m "Refresh market data ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Install dependencies
        run: npm install

      # The suite asserts against the data the build just loaded, so a refresh
      # that returned nonsense fails here rather than reaching the site.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload dist folder
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
